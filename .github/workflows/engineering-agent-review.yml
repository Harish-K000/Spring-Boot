name: Engineering Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: engineering-agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  engineering-review:
    name: Engineering Agent Review
    # Only trusted same-repository branches may execute on the persistent Mac.
    # This condition is defense in depth, not a sandbox for hostile PR workflows.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      AGENT_MODEL: qwen2.5:1.5b
      OLLAMA_MODEL_ID: 65ec06548149
      OLLAMA_HOST: 127.0.0.1:11435
      OLLAMA_NO_CLOUD: "1"
      AGENT_MCP_URL: http://127.0.0.1:18091
      AGENT_URL: http://127.0.0.1:18090
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted CI revisions and prepare runtime
        run: |
          set -euo pipefail
          REVIEW_STATE="$RUNNER_TEMP/engineering-review-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          REVIEW_OUTPUT="$REVIEW_STATE/review.json"
          mkdir -m 700 "$REVIEW_STATE"
          echo "REVIEW_STATE=$REVIEW_STATE" >> "$GITHUB_ENV"
          echo "REVIEW_OUTPUT=$REVIEW_OUTPUT" >> "$GITHUB_ENV"
          printf '{"schemaVersion":1,"headCommit":"%s","result":"BLOCKED","reasons":["review did not complete"],"services":[]}\n' \
            "$HEAD_SHA" > "$REVIEW_OUTPUT"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          # Three-dot review permits main to advance after the feature branch forks.
          git merge-base "$BASE_SHA" "$HEAD_SHA" > /dev/null
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          echo "AGENT_AUDIT_DB_PATH=$REVIEW_STATE/audit" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import socket
          for port in (11435, 18090, 18091):
              with socket.socket() as probe:
                  probe.bind(("127.0.0.1", port))
          PY

      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Verify installed scanners
        run: |
          set -euo pipefail
          test "$(semgrep --version)" = "1.176.0"
          test "$(gitleaks version)" = "8.30.1"
          osv-scanner --version | grep --fixed-strings "osv-scanner version: 2.6.0"

      - name: Verify Ollama
        run: |
          set -euo pipefail
          # Use the Mac's installed model with a job-owned daemon on a separate port.
          nohup ollama serve > "$REVIEW_STATE/ollama.log" 2>&1 &
          pid=$!
          echo "$pid" > "$REVIEW_STATE/ollama.pid"
          for attempt in {1..60}; do
            kill -0 "$pid"
            if curl --silent --fail --max-time 2 "http://$OLLAMA_HOST/api/version" > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail --max-time 2 "http://$OLLAMA_HOST/api/version" > /dev/null
          ollama list
          test "$(ollama list | awk -v model="$AGENT_MODEL" '$1 == model {print $2}')" = "$OLLAMA_MODEL_ID"

      - name: Test the deterministic gate policy
        run: python3 -m unittest services/engineering-agent/scripts/test_ci_review_gate.py

      - name: Build Engineering Agent
        run: ./mvnw -B -ntp -pl services/engineering-agent -am package

      - name: Start MCP Server
        env:
          AGENT_REPOSITORY: ${{ github.workspace }}
          AGENT_REVIEW_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          nohup java -jar services/engineering-agent/target/engineering-agent-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=mcp-server \
            --server.port=18091 \
            --agent.build.java-home="$JAVA_HOME" \
            --agent.security.semgrep-executable="$(command -v semgrep)" \
            --agent.security.gitleaks-executable="$(command -v gitleaks)" \
            --agent.security.osv-executable="$(command -v osv-scanner)" \
            > "$REVIEW_STATE/engineering-mcp.log" 2>&1 &
          pid=$!
          echo "$pid" > "$REVIEW_STATE/mcp.pid"
          for attempt in {1..120}; do
            kill -0 "$pid"
            if curl --silent --fail --max-time 2 "$AGENT_MCP_URL/actuator/health" > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail --max-time 2 "$AGENT_MCP_URL/actuator/health" > /dev/null

      - name: Start Engineering Agent
        env:
          AGENT_REPOSITORY: ${{ github.workspace }}
        run: |
          set -euo pipefail
          nohup java -jar services/engineering-agent/target/engineering-agent-0.0.1-SNAPSHOT.jar \
            --server.port=18090 \
            --spring.ai.ollama.base-url="http://$OLLAMA_HOST" \
            > "$REVIEW_STATE/engineering-agent.log" 2>&1 &
          pid=$!
          echo "$pid" > "$REVIEW_STATE/agent.pid"
          for attempt in {1..120}; do
            kill -0 "$pid"
            if curl --silent --fail --max-time 2 "$AGENT_URL/actuator/health" > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail --max-time 2 "$AGENT_URL/actuator/health" > /dev/null

      - name: Run PR Review
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          # Existing gate calls POST /api/agent/review and verifies the audit SHA.
          # Java owns the fixed base...HEAD Git commands; Qwen receives evidence only.
          python3 services/engineering-agent/scripts/ci_review_gate.py \
            --agent-url "$AGENT_URL" \
            --expected-head "$HEAD_SHA" \
            --output "$REVIEW_OUTPUT"

      - name: Stop job-owned processes
        if: always()
        run: |
          [ -n "${REVIEW_STATE:-}" ] || exit 0
          for component in agent mcp ollama; do
            pid_file="$REVIEW_STATE/$component.pid"
            if [ -f "$pid_file" ]; then
              pid=$(cat "$pid_file")
              kill "$pid" 2>/dev/null || true
              for attempt in {1..10}; do
                if ! kill -0 "$pid" 2>/dev/null; then break; fi
                sleep 1
              done
              if kill -0 "$pid" 2>/dev/null; then kill -KILL "$pid" 2>/dev/null || true; fi
              rm -f "$pid_file"
            fi
          done

      - name: Upload sanitized review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-agent-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ env.REVIEW_OUTPUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove private runtime files
        if: always()
        run: |
          [ -n "${REVIEW_STATE:-}" ] || exit 0
          # Audit databases include local action tokens; never upload them or raw logs.
          rm -f "$REVIEW_STATE"/*.db "$REVIEW_STATE"/*.log
