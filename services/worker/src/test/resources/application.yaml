# In-memory H2 so the suite needs no Docker/Postgres, matching the other modules.
spring:
  datasource:
    url: jdbc:h2:mem:worker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
worker:
  scheduling:
    enabled: false
