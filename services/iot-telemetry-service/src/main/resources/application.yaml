spring:
  application:
    name: iot-telemetry-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:platform}?currentSchema=iot
    username: ${DB_USER:platform}
    password: ${DB_PASS:platform}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: iot
  flyway:
    enabled: true
    create-schemas: true
    schemas: iot
    default-schema: iot

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: iot-telemetry-persistence-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.platform.iot.event
        spring.json.value.default.type: com.example.platform.iot.event.TelemetryEvent
    listener:
      ack-mode: record

iot:
  kafka:
    telemetry-topic: iot.telemetry.v1

server:
  port: 8086
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
