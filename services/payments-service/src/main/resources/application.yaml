spring:
  application:
    name: payments-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:platform}?currentSchema=payments
    username: ${DB_USER:platform}
    password: ${DB_PASS:platform}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    create-schemas: true
    schemas: payments
    default-schema: payments
  data:
    web:
      pageable:
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

clients:
  orders:
    base-url: ${ORDERS_SERVICE_URI:http://localhost:8082}
    connect-timeout: ${ORDERS_CONNECT_TIMEOUT:1s}
    read-timeout: ${ORDERS_READ_TIMEOUT:2s}
    retry:
      max-attempts: ${ORDERS_RETRY_MAX_ATTEMPTS:2}
      initial-backoff: ${ORDERS_RETRY_INITIAL_BACKOFF:100ms}
      max-backoff: ${ORDERS_RETRY_MAX_BACKOFF:500ms}

spring.cloud.circuitbreaker.resilience4j.disable-time-limiter: true

security:
  jwt:
    # Must match Auth Service and Edge Gateway. There is intentionally no fallback.
    secret: ${JWT_SECRET:}

resilience4j:
  circuitbreaker:
    instances:
      orders:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.example.platform.payments.exception.PaymentDependencyException
        ignore-exceptions:
          - com.example.platform.payments.exception.PaymentRejectedException

payments:
  provider: ${PAYMENT_PROVIDER:sandbox}

server:
  port: 8084
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    annotations:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORT_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
